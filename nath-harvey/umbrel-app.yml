releaseNotes: >-
  Adds opt-in bounded local outreach with free-provider budgets, sourced eligibility, first-contact limits, J+4/J+10 followups, French refusal handling and transactional replies. Read-only Calendly reconciliation records actual appointments and blocks cold outreach when sync is incomplete. Explicit Start/Stop intention survives restart, with visible cycle health and a graceful drain of up to 30 minutes. Fresh installs remain stopped. Umbrel authentication, private persistent logins and the pinned upstream version are preserved. Provider accounts, controlled delivery/calendar tests, backup restoration and a real host-reboot check are still operator prerequisites; installation does not activate autopilot.
