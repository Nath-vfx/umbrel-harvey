description: >-
  Harvey finds prospects, drafts outreach, handles replies and helps book meetings using your Claude or ChatGPT subscription.


  This independent community package integrates Harvey with Umbrel's app authentication and persistent app storage. Your configuration, database, prompts, skills and provider logins remain on your Umbrel.


  Open the dashboard to configure your product and mailbox. A Claude subscription login or Codex login is required; the provider CLIs are included. Use Umbrel's app terminal for provider authentication if needed. Installation starts the dashboard only, not outreach. Complete setup and explicitly start Harvey when ready; review the approval and sending settings before sending email.
