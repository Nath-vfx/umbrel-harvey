version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: nath-harvey_server_1
      APP_PORT: 5555
  server:
    image: ghcr.io/nath-vfx/harvey-umbrel:8023a949-autonomy-1
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 31m
    volumes:
      - ${APP_DATA_DIR}/data:/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
