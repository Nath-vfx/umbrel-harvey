name: Publish maintenance Codex pin
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-codex-0.159.3
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/nath-vfx/harvey-umbrel:8023a949-3-codex-0.159.3
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse an existing immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          tag="${IMAGE##*:}"
          existing="$(gh api --paginate "/users/$OWNER/packages/container/harvey-umbrel/versions?per_page=100" \
            --jq ".[] | select((.metadata.container.tags // []) | index(\"$tag\")) | .id")"
          if [ -n "$existing" ]; then
            echo "::error::Immutable image tag already exists; refusing replacement."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build unchanged runtime with pinned Codex
        uses: docker/build-push-action@v6
        with:
          context: codex-pin
          file: codex-pin/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
      - name: Check CLI and installed Python adapter
        run: |
          docker run --rm --network none --entrypoint codex "$IMAGE" --version
          docker run --rm --network none "$IMAGE" /opt/venv/bin/python -c \
            'import sys; from harvey.codex import check_cli_version; assert sys.prefix == "/opt/venv", sys.prefix; assert check_cli_version() == "0.159.3"; print("Original Python runtime accepts Codex 0.159.3 without credentials")'
      - name: Smoke actual fresh dashboard and restart without network
        run: |
          docker volume create harvey-codex-pin-smoke
          docker run -d --name harvey-codex-pin-smoke --network none \
            -v harvey-codex-pin-smoke:/app "$IMAGE"
          cat > "$RUNNER_TEMP/check-codex-pin.py" <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:5555"
          for attempt in range(150):
              try:
                  with urllib.request.urlopen(base + "/api/harvey/status", timeout=2) as response:
                      status = json.load(response)
                  break
              except (urllib.error.URLError, ConnectionError, TimeoutError):
                  time.sleep(0.2)
          else:
              raise RuntimeError("Isolated dashboard did not become available")
          assert status["running"] is False and status["pid"] is None, status
          with urllib.request.urlopen(base + "/", timeout=5) as response:
              assert response.status == 200
              assert b"<html" in response.read().lower()
          with urllib.request.urlopen(base + "/api/sending-mode", timeout=5) as response:
              sending = json.load(response)
          assert sending["mode"] == "approval", sending
          print("Actual dashboard: stopped, no PID, approval; network disabled, no credentials or sends")
          PY
          docker cp "$RUNNER_TEMP/check-codex-pin.py" harvey-codex-pin-smoke:/tmp/check-codex-pin.py
          docker exec harvey-codex-pin-smoke /opt/venv/bin/python /tmp/check-codex-pin.py
          docker restart harvey-codex-pin-smoke
          docker exec harvey-codex-pin-smoke /opt/venv/bin/python /tmp/check-codex-pin.py
      - name: Publish verified immutable image
        run: docker push "$IMAGE"
      - name: Clean isolated container
        if: always()
        run: |
          docker rm -f harvey-codex-pin-smoke || true
          docker volume rm harvey-codex-pin-smoke || true
